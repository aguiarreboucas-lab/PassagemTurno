 function add(it,m,comp){var k=keyOf(it),e=mp[k];if(!e){e=mp[k]={mrn:it.mrn||'',pn:it.pn||'',desc:it.desc||'',comp:comp,f:[]};ord.push(e)}else{if(!e.pn&&it.pn)e.pn=it.pn;if(!e.mrn&&it.mrn)e.mrn=it.mrn}
  PM[m].c.forEach(function(c){if(['mrn','pn','desc','qtd'].indexOf(c[0])>-1)return;var v=it[c[0]],lb=c[2]||c[1];if(v&&!e.f.some(function(x){return x[0]===lb}))e.f.push([lb,v])})}
 (PS.chamado||[]).forEach(function(g){g.itens.forEach(function(it){add(it,'chamado',g.nome)})});
 (PS.pesos||[]).forEach(function(it){add(it,'pesos',pname('pesos'))});(PS.icamento||[]).forEach(function(it){add(it,'icamento',pname('icamento'))});
 return ord}
function pkTxt(e){return e.desc+' ('+['MRN '+e.mrn,'PN '+e.pn].concat(e.f.map(function(x){return x[0]+' '+x[1]})).join(', ')+')'}
function pkRender(){var q=$('pkq').value.trim().toLowerCase();PKL=pkCat().filter(function(e){return!q||(e.mrn+' '+e.pn+' '+e.desc+' '+e.comp+' '+e.f.map(function(x){return x[1]}).join(' ')).toLowerCase().indexOf(q)>-1}).slice(0,40);
 $('pkl').innerHTML=PKL.length?PKL.map(function(e,x){return '<button type="button" class="pi" style="display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit" data-a="pkpick" data-x="'+x+'"><div class="pd">'+esc(e.desc)+'</div><div class="pm"><span>'+esc(e.comp)+'</span><span>MRN '+esc(e.mrn)+'</span><span>PN '+esc(e.pn)+'</span>'+e.f.map(function(f){return '<span>'+esc(f[0]+' '+f[1])+'</span>'}).join('')+'</div></button>'}).join(''):'<p class="info">Nada encontrado no Pit-Stop.</p>'}
var PU=null,PKF=['Descrição','PN'];
try{var pf=JSON.parse(localStorage.getItem('pt-pkf'));if(Array.isArray(pf))PKF=pf}catch(e){}
function puFields(e){return[['Descrição',e.desc],['Item MRN',e.mrn],['PN',e.pn]].concat(e.f).filter(function(x){return x[1]})}
function puText(){var fs=puFields(PU.e).filter(function(x){return PKF.indexOf(x[0])>-1}),d=fs.filter(function(x){return x[0]==='Descrição'})[0],o=fs.filter(function(x){return x[0]!=='Descrição'}).map(function(x){return(x[0]==='Item MRN'?'MRN':x[0])+' '+x[1]}),obs=$('puo').value.trim(),s;
 if(d)s=d[1]+(o.length?' ('+o.join(', ')+')':'');else s=o.join(', ');return s+(obs?(s?' – ':'')+obs:'')}
function puPrev(){$('puc').innerHTML=puFields(PU.e).map(function(x){return '<button type="button" class="chip'+(PKF.indexOf(x[0])>-1?' on':'')+'" data-a="pu_f" data-v="'+esc(x[0])+'">'+esc(x[0])+': '+esc(x[1])+'</button>'}).join('');$('pup').textContent=puText()||'Marque ao menos um campo.'}
function puOpen(e,mode,tg){if(!e){toast('Item não encontrado.');return}PU={e:e,mode:mode,tg:tg};$('put').textContent=e.desc||'Item do Pit-Stop';$('puo').value='';
 $('pub').innerHTML=mode==='campo'?'<button class="b2" data-a="pu_campo">Inserir no campo</button>':'<button class="b2" data-a="pu_pend">Adicionar às pendências do turno</button><button class="b1" data-a="pu_wa">Enviar no WhatsApp</button><button class="b1" data-a="pu_cp">Copiar</button>';
 puPrev();$('pu').classList.add('open')}
function puAct(a,b){
 if(a==='pk'){PKT={i:+b.dataset.i,t:b.dataset.v};$('pkq').value='';pkRender();$('pk').classList.add('open');setTimeout(function(){$('pkq').focus()},250);return true}
 if(a==='pkpick'){puOpen(PKL[+b.dataset.x],'campo',PKT);return true}
 if(!PU)return true;
 if(a==='pu_f'){var v=b.dataset.v,i=PKF.indexOf(v);if(i>-1)PKF.splice(i,1);else PKF.push(v);try{localStorage.setItem('pt-pkf',JSON.stringify(PKF))}catch(e){}puPrev();return true}
 var tx=puText();if(!tx){toast('Marque ao menos um campo.');return true}
 if(a==='pu_campo'){var r=S.regs[PU.tg.i];r[PU.tg.t]=(r[PU.tg.t]?r[PU.tg.t]+'; ':'')+tx;save();$('pu').classList.remove('open');$('pk').classList.remove('open');render();toast('Incluído no campo');return true}
 if(a==='pu_pend'){S.pend=(S.pend.trim()?S.pend.trim()+'\n':'')+tx;$('pend').value=S.pend;save();$('msg').textContent=build();$('pu').classList.remove('open');toast('Adicionado às pendências do turno');return true}
 if(a==='pu_wa'){var l=document.createElement('a');l.href='https://wa.me/?text='+encodeURIComponent('🔩 PIT-STOP: '+tx);l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove();return true}
 if(a==='pu_cp'){copiarP(tx);return true}
 return true}

var PSEL={},PSK=[['chamado','Lista de peças (itens com MRN, PN, descrição, série e quantidade)'],['pesos','Peso de componentes'],['icamento','Material de içamento'],['manut','Manutenção em dia (tabelas)'],['anexos','Informes (links e pastas)']];
function pname(k){return(CFG.psn&&CFG.psn[k])||PM[k].t}

function safeU(u){return /^https?:\/\//i.test(u||'')?u:'#'}
function ftype(it){var s=((it.desc||'')+' '+(it.url||'')).toLowerCase();
 if(/\/spreadsheets\/|\.xlsx?\b|\.csv\b/.test(s))return['XLS','#2E7D32'];if(/\/document\/|\.docx?\b/.test(s))return['DOC','#1565C0'];if(/\/presentation\/|\.pptx?\b/.test(s))return['PPT','#E65100'];if(/\.pdf\b/.test(s))return['PDF','#C62828'];if(/\.(jpe?g|png|gif|webp)\b/.test(s))return['IMG','#6A1B9A'];if(/\.(mp4|mov|avi|mkv)\b/.test(s))return['VÍDEO','#00838F'];if(/\/folders\//.test(s))return['PASTA','#B26A00'];return['LINK','#546E7A']}
function badge(it){var f=ftype(it);return '<span class="ft" style="background:'+f[1]+'">'+f[0]+'</span>'}
function compNomes(){var o={},r=[];(PS.chamado||[]).forEach(function(g){if(!o[g.nome]){o[g.nome]=1;r.push(g.nome)}});return r}
function anexosDe(nome){var l=[];(PS.anexos||[]).forEach(function(g){g.itens.forEach(function(it){if(it.comp&&it.comp.trim().toLowerCase()===nome.trim().toLowerCase())l.push(it)})});if(!l.length)return '';return '<div class="chips" style="margin-top:10px">'+l.map(function(it){return '<a class="chip" href="'+esc(safeU(it.url))+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">'+badge(it)+esc(it.desc)+'</a>'}).join('')+'</div>'}
var SYNC={};
function salvou(ok,msg){SYNC.save=ok?'ok':'erro';SYNC.t=new Date();toast(ok?msg:'Não foi possível salvar na planilha. A alteração ficou só neste aparelho.');psInfo()}
function psInfo(){var s='',h=function(d){return d?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''};
 if(!PLAN)s='Sem planilha configurada: alterações só neste aparelho.';
 else if(SYNC.save==='erro')s='Atenção: a última alteração NÃO foi salva na planilha e os outros aparelhos não vão ver. Tente de novo com internet.';
 else if(SYNC.cfg==='erro'||SYNC.ps==='erro')s='Atenção: não foi possível ler a planilha agora.';
 else if(SYNC.t)s='Sincronizado com a planilha às '+h(SYNC.t)+'.';
 var e=$('admsync');if(e)e.textContent=s;var p=$('pstat');if(p)p.textContent=s}

 var ps=o.ps||(o.chamado?o:null);if(!ps||!Array.isArray(ps.chamado)||!Array.isArray(ps.pesos)||!Array.isArray(ps.icamento)||!Array.isArray(ps.manut)){toast('Esse arquivo não é um backup do Pit-Stop.');return}
 if(!ADMPW){toast('Entre pela área restrita.');return}
 if(!confirm('Restaurar este backup'+(o.geradoEm?' (de '+new Date(o.geradoEm).toLocaleString('pt-BR')+')':'')+'? O Pit-Stop atual'+(o.cfg?' e as listas das configurações':'')+' serão substituídos.'))return;
 PS=ps;psFix();psSave();
 if(o.cfg){for(var k in DEF)if(o.cfg[k]!==undefined)CFG[k]=o.cfg[k];saveCfg();fillCtx();render();if(!$('admin').hidden)admRender()}
 toast('Backup restaurado')};rd.readAsText(f)});
